<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="/runtime-config.js"></script>
    <!-- 禁止移动端缩放：注意会影响无障碍可访问性（视力障碍用户无法放大） -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no"
    />
    <title>TGYS TV - TGYS 影视｜在线观看电影电视剧</title>
    <meta
      name="description"
      content="TGYS TV（tgys）私人流媒体影院：聚合影视搜索与在线播放，电影、电视剧、综艺、动漫一站观看。搜索 tgys 即可找到 TGYS TV。"
    />
    <meta name="keywords" content="TGYS,TGYS TV,tgys,tgys tv,TGYS影视,TGYS影院" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="TGYS TV" />

    <!-- Open Graph（分享与搜索摘要） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TGYS TV" />
    <meta property="og:title" content="TGYS TV - TGYS 影视｜在线观看电影电视剧" />
    <meta
      property="og:description"
      content="TGYS TV（tgys）私人流媒体影院：聚合影视搜索与在线播放，电影、电视剧、综艺、动漫一站观看。"
    />
    <meta property="og:locale" content="zh_CN" />

    <!-- 结构化数据：帮助搜索引擎把 TGYS 识别为站点品牌名 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TGYS TV",
        "alternateName": ["TGYS", "tgys", "TGYS影视"]
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- 首屏启动屏：JS 包加载完成前先渲染品牌占位，避免白屏；React 挂载时自动替换 -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
        color: #111827;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        z-index: 9999;
      }
      @media (prefers-color-scheme: dark) {
        #app-splash {
          background: #0a0a0a;
          color: #f9fafb;
        }
      }
      #app-splash .splash-ring {
        width: 44px;
        height: 44px;
        border-radius: 9999px;
        border: 3px solid rgba(128, 128, 128, 0.3);
        border-top-color: currentColor;
        animation: splash-spin 0.9s linear infinite;
      }
      #app-splash .splash-name {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      #app-splash .splash-sub {
        font-size: 12px;
        opacity: 0.55;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-hidden="true">
        <div class="splash-ring"></div>
        <div class="splash-name">TGYS TV</div>
        <div class="splash-sub">你的私人流媒体影院</div>
      </div>
    </div>
    <script>
      /* 额外保险（主要针对旧版 iOS Safari 的双指/三指手势） */
      document.addEventListener(
        'gesturestart',
        function (e) {
          e.preventDefault()
        },
        { passive: false },
      )
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
